# PIMiner experiment spec — InjecAgent benchmark (ported from PISmith).
# Build:  python piminer_plan.py experiments/injecagent.yaml
# Run train: PIM_WAVE_SIZE=5 PIM_ATTACK_MODE=rolling ./piminer_train_parallel.sh eval_results/pim_train/injecagent
# Run test:  PIM_WAVE_SIZE=5 PIM_ATTACK_MODE=rolling ./piminer_test_parallel.sh  eval_results/pim_test/injecagent
#
# NOTE: InjecAgent in PIMiner targets GPT/OpenAI models ONLY (faithful to PISmith's
# evaluate_output_finetuned path). Requires OPENAI_API_KEY in the environment/.env.
name: injecagent
max_iters: 10
test_max_iters: 10
threat_model: black_box

test:
  - {dataset: injecagent, target: gpt-5-nano, n: 30}
  - {dataset: injecagent, target: gpt-4.1-nano, n: 30}
  - {dataset: injecagent, target: gpt-4o-mini, n: 30}
